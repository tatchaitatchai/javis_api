openapi: 3.0.3
info:
  title: JAVIS Home API
  version: 0.1.0
  description: |
    Contract for the JAVIS Home API. This file is the source of truth: Go server
    types are generated from it (`make generate`) and clients may generate from it.
    Product routes live under `/v1`; health routes are unversioned.
tags:
  - name: health
    description: Process liveness and database readiness
  - name: auth
    description: Phone OTP sign-in, sessions and the signed-in account
  - name: homes
    description: Homes and zones. A non-member always receives 404.
  - name: members
    description: People in a home, invitations and their answers.
  - name: devices
    description: Which home a device belongs to. Live state stays with the provider.
  - name: scenes
    description: Saved scenes. Clients run them and report the run.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Process liveness
      description: Succeeds while the process serves HTTP. Never touches the database.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Database readiness
      description: Pings PostgreSQL with a bounded timeout. Does not inspect migrations.
      responses:
        "200":
          description: Database responded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Database unavailable (`database_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Send a sign-in code
      description: |
        Answers the same whether or not the number has an account. `debug_code`
        is present only when the server runs in OTP debug mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: Code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          description: Not a Thai mobile number (`invalid_phone`) or a malformed request (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Send limit reached (`rate_limited`)
          headers:
            Retry-After:
              required: true
              description: Seconds until another request can succeed
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The SMS could not be sent (`sms_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Exchange a code for a session
      description: The first successful verification creates the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Malformed request (`invalid_request`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong, expired or used code (`invalid_code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many wrong attempts on this code (`too_many_attempts`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Set the account name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Name is empty, too long or invalid (`invalid_name`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes:
    get:
      operationId: listHomes
      tags: [homes]
      summary: Homes the caller belongs to
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Homes, oldest membership first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeList"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createHome
      tags: [homes]
      summary: Create a home with its zones; the caller becomes the owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "400":
          description: Invalid name or zone (`invalid_home`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The caller owns the maximum number of homes (`home_limit_reached`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}:
    get:
      operationId: getHome
      tags: [homes]
      summary: A home with its zones
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      responses:
        "200":
          description: Home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateHome
      tags: [homes]
      summary: Rename a home (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeUpdate"
      responses:
        "200":
          description: Updated home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "400":
          description: Invalid name (`invalid_home`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteHome
      tags: [homes]
      summary: Delete a home and everything in it (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Devices are still registered to this home (`home_has_devices`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/zones:
    post:
      operationId: addZone
      tags: [homes]
      summary: Add a zone (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          description: Not exactly one valid preset_key or name (`invalid_zone`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The home has the maximum number of zones (`zone_limit_reached`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/members:
    get:
      operationId: listMembers
      summary: People in a home and its open invitations
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/homeId"
      responses:
        "200":
          description: Members and open invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/members/{userId}:
    patch:
      operationId: updateMember
      summary: Change a member's role or unlock right (owner)
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: The updated member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: No valid field to change (`invalid_member_update`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the owner may do this, and the owner cannot be changed (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or person (`member_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeMember
      summary: Remove a member, or leave the home by removing yourself
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/userId"
      responses:
        "204":
          description: The person is no longer in the home.
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this, or the target is the owner (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or person (`member_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/invites:
    post:
      operationId: createInvite
      summary: Invite a mobile number to a home
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/homeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The invitation, valid for seven days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          description: Not a Thai mobile number (`invalid_phone`) or unknown role (`invalid_role`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this invitation (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (`already_member`, `already_invited` or `member_limit_reached`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      summary: Cancel an open invitation
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/inviteId"
      responses:
        "204":
          description: The invitation can no longer be accepted.
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or invitation (`invite_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/invites:
    get:
      operationId: listReceivedInvites
      summary: Open invitations for the signed-in number
      tags: [members]
      responses:
        "200":
          description: Open invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedInviteList"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/invites/{inviteId}/accept:
    post:
      operationId: acceptInvite
      summary: Join the home of an invitation
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/inviteId"
      responses:
        "200":
          description: The home that was joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No open invitation for this number (`invite_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/me/invites/{inviteId}/decline:
    post:
      operationId: declineInvite
      summary: Decline an invitation
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/inviteId"
      responses:
        "204":
          description: The invitation was declined.
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No open invitation for this number (`invite_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: Devices registered to a home
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: claimDevice
      tags: [devices]
      summary: Register a paired device to a home (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceClaim"
      responses:
        "200":
          description: Already registered to this home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Unknown provider or kind, or an invalid name, zone or reference (`invalid_device`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (`device_claimed` or `device_limit_reached`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/devices/{deviceId}:
    patch:
      operationId: updateDevice
      tags: [devices]
      summary: Rename a device or move it to a zone (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/deviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: No valid field to change (`invalid_device`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or device (`device_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeDevice
      tags: [devices]
      summary: Remove a device from a home (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/deviceId"
      responses:
        "204":
          description: Removed
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or device (`device_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/scenes:
    get:
      operationId: listScenes
      tags: [scenes]
      summary: Scenes of a home
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      responses:
        "200":
          description: Scenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneList"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createScene
      tags: [scenes]
      summary: Add a scene (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "400":
          description: The scene is not valid (`invalid_scene`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not a home the caller belongs to (`home_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The home has the maximum number of scenes (`scene_limit_reached`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/scenes/{sceneId}:
    put:
      operationId: updateScene
      tags: [scenes]
      summary: Replace a scene (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/sceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "400":
          description: The scene is not valid (`invalid_scene`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or scene (`scene_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteScene
      tags: [scenes]
      summary: Delete a scene (admin or owner)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/sceneId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role does not allow this (`forbidden`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or scene (`scene_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/homes/{homeId}/scenes/{sceneId}/runs:
    post:
      operationId: recordSceneRun
      tags: [scenes]
      summary: Record that a member ran a scene on their device
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/homeId"
        - $ref: "#/components/parameters/sceneId"
      responses:
        "200":
          description: The scene with its new last run time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "401":
          description: Missing or invalid session (`unauthorized`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown home (`home_not_found`) or scene (`scene_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    homeId:
      name: homeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    inviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    deviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sceneId:
      name: sceneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HomeRole:
      type: string
      enum: [owner, admin, member]
    Zone:
      type: object
      required: [id, preset_key, name]
      properties:
        id:
          type: string
          format: uuid
        preset_key:
          type: string
          nullable: true
          description: Translated by the client. Null when the zone has a typed name.
        name:
          type: string
          nullable: true
          description: Shown exactly as typed. Null when the zone is a preset.
    ZoneInput:
      type: object
      description: Exactly one of preset_key or name
      properties:
        preset_key:
          type: string
          description: One of Living room, Bedroom, Kitchen, Front yard, Office, Bathroom, Kids room
        name:
          type: string
          description: 1 to 60 characters after trimming
    Home:
      type: object
      required: [id, name, role, can_unlock, zones]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/HomeRole"
        can_unlock:
          type: boolean
          description: Whether the caller may unlock this home's door
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
    HomeSummary:
      type: object
      required: [id, name, role, zone_count, member_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/HomeRole"
        zone_count:
          type: integer
        member_count:
          type: integer
    HomeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HomeSummary"
    HomeCreate:
      type: object
      required: [name, zones]
      properties:
        name:
          type: string
          description: 1 to 60 characters after trimming
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneInput"
    HomeUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 60 characters after trimming
    InviteRole:
      type: string
      enum: [admin, member]
    Member:
      type: object
      required: [user_id, name, role, can_unlock]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/HomeRole"
        can_unlock:
          type: boolean
    MemberUpdate:
      type: object
      description: Send at least one field.
      properties:
        role:
          $ref: "#/components/schemas/InviteRole"
        can_unlock:
          type: boolean
    MemberList:
      type: object
      required: [members, invites]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    Invite:
      type: object
      required: [id, phone_masked, role, can_unlock, expires_at]
      properties:
        id:
          type: string
          format: uuid
        phone_masked:
          type: string
          example: 089 xxx 4521
        role:
          $ref: "#/components/schemas/InviteRole"
        can_unlock:
          type: boolean
        expires_at:
          type: string
          format: date-time
    InviteCreate:
      type: object
      required: [phone, role, can_unlock]
      properties:
        phone:
          type: string
          description: E.164 Thai mobile number.
          example: "+66891234521"
        role:
          $ref: "#/components/schemas/InviteRole"
        can_unlock:
          type: boolean
    ReceivedInvite:
      type: object
      required: [id, home_name, invited_by_name, role, zone_count, expires_at]
      properties:
        id:
          type: string
          format: uuid
        home_name:
          type: string
        invited_by_name:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/InviteRole"
        zone_count:
          type: integer
        expires_at:
          type: string
          format: date-time
    ReceivedInviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedInvite"
    Device:
      type: object
      required: [id, provider, external_ref, kind, name, zone_id]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [tuya]
        external_ref:
          type: string
          description: The provider's device id
        kind:
          type: string
          enum: [light]
        name:
          type: string
          nullable: true
        zone_id:
          type: string
          format: uuid
          nullable: true
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    DeviceClaim:
      type: object
      required: [provider, external_ref, kind]
      properties:
        provider:
          type: string
        external_ref:
          type: string
        kind:
          type: string
        name:
          type: string
        zone_id:
          type: string
          format: uuid
    DeviceUpdate:
      type: object
      description: Send at least one field.
      properties:
        name:
          type: string
        zone_id:
          type: string
          format: uuid
    SceneTarget:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [device, zone, others, all]
        key:
          type: string
          description: Device id or zone preset key; only for `device` and `zone`
    SceneAction:
      type: object
      required: [type]
      description: |
        `light` needs `target` and `is_on`. `lock_check` has no other field and
        never unlocks.
      properties:
        type:
          type: string
          enum: [light, lock_check]
        target:
          $ref: "#/components/schemas/SceneTarget"
        is_on:
          type: boolean
        brightness:
          type: number
          format: double
        temperature:
          type: integer
    SceneInput:
      type: object
      required: [icon, actions]
      description: Send exactly one of `preset_key` or `name`.
      properties:
        icon:
          type: string
          enum: [moon, home, leave, sunrise, sparkle]
        preset_key:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        actions:
          type: array
          items:
            $ref: "#/components/schemas/SceneAction"
    Scene:
      type: object
      required: [id, icon, preset_key, name, actions, last_run_at]
      properties:
        id:
          type: string
          format: uuid
        icon:
          type: string
        preset_key:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        actions:
          type: array
          items:
            $ref: "#/components/schemas/SceneAction"
        last_run_at:
          type: string
          format: date-time
          nullable: true
    SceneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: Thai mobile number in E.164 form
          example: "+66812345678"
    OtpChallenge:
      type: object
      required: [resend_after_seconds, expires_in_seconds]
      properties:
        resend_after_seconds:
          type: integer
        expires_in_seconds:
          type: integer
        debug_code:
          type: string
          description: The code itself; only in OTP debug mode, never in production
    OtpVerification:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: "+66812345678"
        code:
          type: string
          description: Six digits
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Bearer token; shown once and stored only as a hash on the server
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, phone, name]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
          nullable: true
          description: Null until the profile step
    UserUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 60 characters after trimming
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case error code for clients to branch on
          example: not_found
        message:
          type: string
          description: Human-readable message; never contains secrets or internal errors
